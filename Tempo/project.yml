name: Tempo
options:
  bundleIdPrefix: app.tempo
  deploymentTarget:
    iOS: "17.4"
    watchOS: "10.0"
  xcodeVersion: "27.0"
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Staging: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: "942QL2V6SV"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    INFOPLIST_PREPROCESS: YES
    INFOPLIST_PREPROCESSOR_DEFINITIONS: __ANTHROPIC_API_KEY__=$(ANTHROPIC_API_KEY) __TEMPO_API_BASE_URL__=$(TEMPO_API_BASE_URL) __TEMPO_ENVIRONMENT__=$(TEMPO_ENVIRONMENT)
    INFOPLIST_OTHER_PREPROCESSOR_FLAGS: -traditional
  configs:
    Debug:
      xcconfig: Tempo/Configuration/Development.xcconfig
    Staging:
      xcconfig: Tempo/Configuration/Staging.xcconfig
    Release:
      xcconfig: Tempo/Configuration/Production.xcconfig

packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    majorVersion: 3.0.0
  FirebaseSDK:
    url: https://github.com/firebase/firebase-ios-sdk
    majorVersion: 11.0.0
  Lottie:
    url: https://github.com/airbnb/lottie-ios
    majorVersion: 4.0.0
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    majorVersion: 1.0.0
  Inject:
    # Hot reload for SwiftUI (dev only). @ObserveInjection + .enableInjection()
    # are no-ops in Release; the -interposable linker flag below is Debug-scoped
    # so this package is never linked into App Store builds.
    url: https://github.com/krzysztofzablocki/Inject.git
    from: 1.2.4

targets:
  Tempo:
    type: application
    platform: iOS
    sources:
      - path: Tempo
        excludes:
          - "Configuration/*.xcconfig"
      # Shared with the TempoWatch target — the quick-action wire types are
      # decoded by the phone's PhoneWatchConnectivityService (§21 sync).
      - path: TempoWatch/Models/WatchQuickAction.swift
      # Shared with the TempoWatch target — WatchSnapshotBuilder (§22)
      # builds one directly and pushes it via PhoneWatchConnectivityService.
      - path: TempoWatch/Models/WatchSnapshot.swift
    dependencies:
      - target: TempoWidget
      - package: PostHog
      - package: FirebaseSDK
        product: FirebaseCrashlytics
      - package: Lottie
      - package: Inject
      - sdk: WeatherKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tempo.Tempo
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        SWIFT_EMIT_LOC_STRINGS: true
        # Disable auto-generated Color/Image symbol extensions: we keep our
        # own curated extension in Color+Tempo.swift which also defines
        # programmatic (non-asset) colors. Auto-generation collides with it.
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        CODE_SIGN_ENTITLEMENTS: Tempo/Tempo.entitlements
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Tempo reads your health data (steps, heart rate, HRV, sleep, workouts) to calculate your daily score, adapt your training plan to your recovery, and track your progress automatically."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Tempo writes your completed workouts and nutrition data to HealthKit so your health record stays complete across all your apps."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Tempo reads your calendar to avoid scheduling workouts during classes and football practice, and to identify study blocks for your accountability targets."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Tempo uses your location to provide weather-aware hydration targets and workout recommendations."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Tempo uses your microphone so you can dictate pantry items hands-free instead of typing each ingredient."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Tempo converts what you say into pantry item names on-device, so you can add ingredients without typing."
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.tempo.Tempo.dev
          # Enables Inject hot reload (simulator/dev only). Must NOT be set on
          # Release — keeps the App Store binary free of interposable symbols.
          OTHER_LDFLAGS: $(inherited) -Xlinker -interposable
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: app.tempo.Tempo.staging
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: app.tempo.Tempo
    configFiles:
      Debug: Tempo/Configuration/Development.xcconfig
      Staging: Tempo/Configuration/Staging.xcconfig
      Release: Tempo/Configuration/Production.xcconfig
    info:
      path: Tempo/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ANTHROPIC_API_KEY: __ANTHROPIC_API_KEY__
        TEMPO_API_BASE_URL: __TEMPO_API_BASE_URL__
        TEMPO_ENVIRONMENT: __TEMPO_ENVIRONMENT__
        BGTaskSchedulerPermittedIdentifiers:
          - com.tempo.healthkit-sync
          - com.tempo.data-sync
          - com.tempo.daily-reset
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: app.tempo.oauth
            CFBundleURLSchemes:
              - tempo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: tempo-bg-primary
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: Tempo uses the camera to scan grocery receipts so it can fill your pantry and price-track items automatically.
        NSPhotoLibraryUsageDescription: Tempo reads receipts from your photo library to import them into your pantry.
        NSRemindersFullAccessUsageDescription: Tempo can save your weekly grocery list to Reminders so you can check items off while shopping.
        NSRemindersUsageDescription: Tempo can save your weekly grocery list to Reminders so you can check items off while shopping.
    preBuildScripts:
      - name: SwiftLint
        shell: /bin/zsh
        script: |
          if command -v swiftlint >/dev/null 2>&1; then
              swiftlint lint --config "${SRCROOT}/.swiftlint.yml" --quiet
          elif [ -x /opt/homebrew/bin/swiftlint ]; then
              /opt/homebrew/bin/swiftlint lint --config "${SRCROOT}/.swiftlint.yml" --quiet
          elif [ -x /usr/local/bin/swiftlint ]; then
              /usr/local/bin/swiftlint lint --config "${SRCROOT}/.swiftlint.yml" --quiet
          else
              echo "warning: SwiftLint not installed. Run 'brew install swiftlint' to enable linting."
          fi
          mkdir -p "${DERIVED_FILE_DIR}"
          touch "${DERIVED_FILE_DIR}/swiftlint.stamp"
        outputFiles:
          - $(DERIVED_FILE_DIR)/swiftlint.stamp
        basedOnDependencyAnalysis: true
      - name: SwiftFormat
        shell: /bin/zsh
        script: |
          if command -v swiftformat >/dev/null 2>&1; then
              swiftformat "${SRCROOT}/Tempo" --config "${SRCROOT}/.swiftformat" --lint --quiet
          elif [ -x /opt/homebrew/bin/swiftformat ]; then
              /opt/homebrew/bin/swiftformat "${SRCROOT}/Tempo" --config "${SRCROOT}/.swiftformat" --lint --quiet
          elif [ -x /usr/local/bin/swiftformat ]; then
              /usr/local/bin/swiftformat "${SRCROOT}/Tempo" --config "${SRCROOT}/.swiftformat" --lint --quiet
          else
              echo "warning: SwiftFormat not installed. Run 'brew install swiftformat' to enable formatting."
          fi
          mkdir -p "${DERIVED_FILE_DIR}"
          touch "${DERIVED_FILE_DIR}/swiftformat.stamp"
        outputFiles:
          - $(DERIVED_FILE_DIR)/swiftformat.stamp
        basedOnDependencyAnalysis: true
    postCompileScripts:
      - name: Increment Build Number
        shell: /bin/zsh
        script: |
          # Xcode Cloud assigns build numbers itself; skip the manual bump there.
          if [ "$CI" = "TRUE" ]; then
              echo "Xcode Cloud detected (CI=TRUE) — skipping manual build-number bump"
              exit 0
          fi
          if [ "${CONFIGURATION}" = "Release" ] || [ "${CONFIGURATION}" = "Staging" ]; then
              plist="${INFOPLIST_FILE}"
              if [ -z "$plist" ]; then plist="${PRODUCT_SETTINGS_PATH}"; fi
              if [ -n "$plist" ] && [ -f "$plist" ]; then
                  buildNumber=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$plist" 2>/dev/null)
                  case "$buildNumber" in
                      ''|*[!0-9]*) echo "CFBundleVersion '$buildNumber' is not an integer — skipping bump" ;;
                      *) buildNumber=$((buildNumber + 1)); /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $buildNumber" "$plist" && echo "Build number incremented to $buildNumber" ;;
                  esac
              else
                  echo "No writable Info.plist (INFOPLIST_FILE='${INFOPLIST_FILE}') — skipping bump"
              fi
          fi
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - TempoTests
        - TempoUITests
        - TempoSnapshotTests
      # StoreKit local testing config (4 Tempo Pro products + 7-day trial).
      # Path is relative to this project spec file. Lets the simulator load
      # products without App Store Connect. XcodeGen 2.44.1+ native support.
      storeKitConfiguration: Tempo/Tempo.storekit

  TempoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TempoTests
    dependencies:
      - target: Tempo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tempo.TempoTests
        GENERATE_INFOPLIST_FILE: true
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        Debug:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tempo Dev.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Tempo Dev"
        Staging:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tempo Staging.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Tempo Staging"
        Release:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tempo.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Tempo"

  TempoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TempoUITests
    dependencies:
      - target: Tempo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tempo.TempoUITests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Tempo

  TempoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TempoWidget
        excludes:
          - "**/*.entitlements"
          - Info.plist
      # Shared with the Tempo app target — the LiveActivity Attributes type
      # is referenced by both `FocusTimerLiveActivity` (widget) and the
      # app's `FocusTimerActivityManager`.
      - path: Tempo/Services/LiveActivity/FocusTimerActivityAttributes.swift
      # Same sharing for the workout Live Activity (§3.9).
      - path: Tempo/Services/LiveActivity/WorkoutActivityAttributes.swift
    dependencies: []
    info:
      path: TempoWidget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Tempo Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tempo.Tempo.widget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: TempoWidget/TempoWidgetExtension.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.tempo.Tempo.dev.widget
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: app.tempo.Tempo.staging.widget
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: app.tempo.Tempo.widget

  TempoWatch:
    type: application
    platform: watchOS
    deploymentTarget:
      watchOS: "10.0"
    sources:
      - path: TempoWatch
        excludes:
          - "**/*.entitlements"
      # Shared with the Tempo app target — the workout payload the phone
      # pushes and the watch consumes (§21 sync).
      - path: Tempo/Services/Integrations/WatchWorkoutPayload.swift
    dependencies: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tempo.Tempo.watchkitapp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "6.0"
        CODE_SIGN_ENTITLEMENTS: TempoWatch/TempoWatch.entitlements
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: app.tempo.Tempo
        INFOPLIST_KEY_CFBundleDisplayName: Tempo
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.tempo.Tempo.dev.watchkitapp
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: app.tempo.Tempo.staging.watchkitapp
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: app.tempo.Tempo.watchkitapp

  TempoSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TempoSnapshotTests
    dependencies:
      - target: Tempo
      - package: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tempo.TempoSnapshotTests
        GENERATE_INFOPLIST_FILE: true
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        Debug:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tempo Dev.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Tempo Dev"
        Staging:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tempo Staging.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Tempo Staging"
        Release:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tempo.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Tempo"
