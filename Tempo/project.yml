name: Tempo
options:
  bundleIdPrefix: app.tempo
  deploymentTarget:
    iOS: "17.4"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""

targets:
  Tempo:
    type: application
    platform: iOS
    sources:
      - path: Tempo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tempo.Tempo
        INFOPLIST_GENERATION_MODE: GeneratedFile
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        SWIFT_EMIT_LOC_STRINGS: true
    scheme:
      testTargets:
        - TempoTests
        - TempoUITests

  TempoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TempoTests
    dependencies:
      - target: Tempo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tempo.TempoTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tempo.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Tempo"
        BUNDLE_LOADER: "$(TEST_HOST)"

  TempoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TempoUITests
    dependencies:
      - target: Tempo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tempo.TempoUITests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Tempo
