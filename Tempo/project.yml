name: Tempo
options:
  bundleIdPrefix: app.tempo
  deploymentTarget:
    iOS: "17.4"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Staging: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
  configs:
    Debug:
      xcconfig: Tempo/Configuration/Development.xcconfig
    Staging:
      xcconfig: Tempo/Configuration/Staging.xcconfig
    Release:
      xcconfig: Tempo/Configuration/Production.xcconfig

packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    majorVersion: 3.0.0
  FirebaseSDK:
    url: https://github.com/firebase/firebase-ios-sdk
    majorVersion: 11.0.0
  Lottie:
    url: https://github.com/airbnb/lottie-ios
    majorVersion: 4.0.0
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    majorVersion: 1.0.0

targets:
  Tempo:
    type: application
    platform: iOS
    sources:
      - path: Tempo
        excludes:
          - "Configuration/*.xcconfig"
    dependencies:
      - package: PostHog
      - package: FirebaseSDK
        product: FirebaseCrashlytics
      - package: Lottie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tempo.Tempo
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        SWIFT_EMIT_LOC_STRINGS: true
        CODE_SIGN_ENTITLEMENTS: Tempo/Tempo.entitlements
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Tempo reads your health data (steps, heart rate, HRV, sleep, workouts) to calculate your daily score, adapt your training plan to your recovery, and track your progress automatically."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Tempo writes your completed workouts and nutrition data to HealthKit so your health record stays complete across all your apps."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Tempo reads your calendar to avoid scheduling workouts during classes and football practice, and to identify study blocks for your accountability targets."
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.tempo.Tempo.dev
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: app.tempo.Tempo.staging
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: app.tempo.Tempo
    info:
      path: Tempo/Info.plist
      properties:
        TEMPO_API_BASE_URL: $(TEMPO_API_BASE_URL)
        TEMPO_ENVIRONMENT: $(TEMPO_ENVIRONMENT)
        BGTaskSchedulerPermittedIdentifiers:
          - com.tempo.healthkit-sync
          - com.tempo.data-sync
          - com.tempo.daily-reset
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: app.tempo.oauth
            CFBundleURLSchemes:
              - tempo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    scheme:
      testTargets:
        - TempoTests
        - TempoUITests

  TempoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TempoTests
    dependencies:
      - target: Tempo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tempo.TempoTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tempo.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Tempo"
        BUNDLE_LOADER: "$(TEST_HOST)"

  TempoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TempoUITests
    dependencies:
      - target: Tempo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tempo.TempoUITests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Tempo

  TempoSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TempoSnapshotTests
    dependencies:
      - target: Tempo
      - package: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tempo.TempoSnapshotTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tempo.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Tempo"
        BUNDLE_LOADER: "$(TEST_HOST)"
