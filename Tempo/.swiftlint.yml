# .swiftlint.yml — Tempo iOS

# Only lint the main source directories
included:
  - Tempo
  - TempoWidget
  - TempoWatch

excluded:
  - Tempo/Preview Content
  - TempoTests
  - TempoUITests
  - TempoSnapshotTests
  - .build
  - DerivedData

# Rules
disabled_rules:
  - trailing_comma                          # We allow trailing commas in multi-line collections
  - opening_brace                           # SwiftFormat handles brace placement
  - todo                                    # TODOs are fine during development
  - identifier_name                         # Snake_case CodingKeys + idiomatic single-char locals
  - shorthand_operator                      # Stylistic, not a bug
  - force_cast                              # Audited via grep; treat case-by-case in review
  - statement_position                      # SwiftFormat handles else/catch placement
  - multiline_arguments                     # Conflicts with SwiftFormat wrapping rules
  - multiline_parameters                    # Conflicts with SwiftFormat wrapping rules
  - multiple_closures_with_trailing_closure # Common SwiftUI pattern (.sheet onDismiss/content)
  - prefer_self_type_over_type_of_self      # Stylistic
  - sorted_first_last                       # Stylistic; sometimes clearer to keep .sorted().last
  - legacy_multiple                         # Stylistic preference for isMultiple(of:)
  - for_where                               # `for x in y { if z { ... } }` is often clearer
  - implicit_optional_initialization        # `var x: Type? = nil` is explicit and clear
  - notification_center_detachment          # Pre-existing pattern
  - closure_end_indentation                 # SwiftFormat handles indentation
  - prefer_zero_over_explicit_init          # Stylistic; CGPoint(x: 0, y: 0) is clear

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - fatal_error_message
  - file_name_no_space
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - strong_iboutlet
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - yoda_condition

# Rule configuration
line_length:
  warning: 300
  error: 400
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

type_body_length:
  warning: 1500
  error: 2000

file_length:
  warning: 1500
  error: 2500
  ignore_comment_only_lines: true

function_body_length:
  warning: 250
  error: 350

function_parameter_count:
  warning: 20
  error: 25

cyclomatic_complexity:
  warning: 25
  error: 40

# Tuples used for chart payloads + AI prompt context bundles can be wide.
large_tuple:
  warning: 8
  error: 10

type_name:
  min_length: 3
  max_length: 50

nesting:
  type_level: 3
  function_level: 5

reporter: xcode
