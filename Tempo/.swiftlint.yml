# .swiftlint.yml — Tempo iOS

# Only lint the main source directories
included:
  - Tempo
  - TempoWidget
  - TempoWatch

excluded:
  - Tempo/Preview Content
  - TempoTests
  - TempoUITests
  - TempoSnapshotTests
  - .build
  - DerivedData

# Rules
disabled_rules:
  - trailing_comma               # We allow trailing commas in multi-line collections
  - opening_brace                # SwiftFormat handles brace placement
  - todo                         # TODOs are fine during development
  - identifier_name              # Snake_case CodingKeys + idiomatic single-char locals
  - shorthand_operator           # Stylistic, not a bug
  - force_cast                   # Audited via grep; treat case-by-case in review

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - fatal_error_message
  - file_name_no_space
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - number_separator
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - strong_iboutlet
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - yoda_condition

# Rule configuration
line_length:
  warning: 200
  error: 300
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

type_body_length:
  warning: 600
  error: 1200

file_length:
  warning: 900
  error: 2000
  ignore_comment_only_lines: true

function_body_length:
  warning: 100
  error: 250

function_parameter_count:
  warning: 10
  error: 25

cyclomatic_complexity:
  warning: 15
  error: 25

# Tuples used for chart payloads + AI prompt context bundles can be wide.
large_tuple:
  warning: 4
  error: 8

type_name:
  min_length: 3
  max_length: 50

# Single-letter locals (r, m, p, s, etc.) are idiomatic Swift in tight
# scopes — `for r in records`, `let m = ...`. Snake_case identifiers
# like `recovery_score` come from CodingKeys/DTOs and MUST match the
# wire format, so we don't lint variable name shape.
identifier_name:
  min_length:
    warning: 1
    error: 1
  max_length:
    warning: 50
    error: 60
  validates_start_with_lowercase: false
  excluded:
    - id
    - x
    - y
    - w
    - h
    - i
    - j
    - n
    - r
    - m
    - p
    - s
    - t
    - v
    - c
    - a
    - d
    - f
    - db
    - hr
    - xp

nesting:
  type_level: 3
  function_level: 5

number_separator:
  minimum_length: 5

modifier_order:
  preferred_modifier_order:
    - acl
    - setterACL
    - override
    - dynamic
    - mutating
    - nonmutating
    - lazy
    - final
    - required
    - convenience
    - typeMethods
    - owned

force_unwrapping:
  severity: warning

reporter: xcode
