              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      connected:
                        type: boolean
                        example: true
                      base_url:
                        type: string
                        example: https://nutritrack.nicoladebbia.com
                      tested_at:
                        type: string
                        format: date-time
                        example: "2026-03-24T12:00:00Z"
                      server_version:
                        type: string
                        example: "1.2.0"
                  meta:
                    $ref: '#/components/schemas/Meta'
        "401":
          $ref: '#/components/responses/Unauthorized'

