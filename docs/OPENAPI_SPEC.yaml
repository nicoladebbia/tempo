      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                days_back:
                  type: integer
                  minimum: 1
                  maximum: 365
                  default: 30
                  example: 30
      responses:
        "202":
          description: Sync queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      sync_id:
                        type: string
                        example: sync_abc123
                      status:
                        type: string
                        example: queued
                      days_back:
                        type: integer
                        example: 30
                      estimated_seconds:
                        type: integer
                        example: 15
                  meta:
                    $ref: '#/components/schemas/Meta'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: Whoop not connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Sync already in progress
          content:
            application/json:
