      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchSyncRequest'
      responses:
        "200":
          description: Batch sync results
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      snapshot:
                        type: object
                        properties:
                          snapshot_id:
                            type: string
                            example: snap_abc123
                          updated:
                            type: boolean
                            example: true
                      workouts:
                        type: object
                        properties:
                          created:
                            type: integer
                            example: 1
                          skipped:
                            type: integer
                            example: 0
                      study_sessions:
                        type: object
                        properties:
                          created:
                            type: integer
                            example: 1
                          skipped:
                            type: integer
                            example: 0
                      xp_events:
                        type: object
                        properties:
                          events_recorded:
                            type: integer
                            example: 1
                          events_skipped:
                            type: integer
                            example: 0
                          xp_earned:
                            type: integer
                            example: 50
                      xp_total:
                        type: integer
                        example: 12550
                      level:
                        type: integer
                        example: 8
                      streak_days:
                        type: integer
                        example: 14
                  meta:
                    $ref: '#/components/schemas/Meta'
