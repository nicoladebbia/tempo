          description: Insufficient data (need 3+ days)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          description: Daily AI limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: Claude API unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

