                  example: "How does my sleep affect my workout performance?"
                date_range:
                  type: object
                  properties:
                    start:
                      type: string
                      format: date
                      example: "2026-02-01"
                    end:
                      type: string
                      format: date
                      example: "2026-03-24"
                data_types:
                  type: array
                  items:
                    type: string
                    enum: [sleep, workouts, recovery, nutrition, study]
                  example: [sleep, workouts, recovery]
      responses:
        "200":
          description: Pattern analysis
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  data:
                    type: object
                    additionalProperties: true
