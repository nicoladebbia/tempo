            database:
              type: object
              properties:
                status:
                  type: string
                  example: healthy
                latency_ms:
                  type: integer
                  example: 2
                pool_active:
                  type: integer
                  example: 12
                pool_max:
                  type: integer
                  example: 50
            redis:
              type: object
              properties:
                status:
                  type: string
                  example: healthy
                latency_ms:
                  type: integer
                  example: 1
                memory_mb:
                  type: integer
                  example: 45
                keys:
                  type: integer
                  example: 12400
            whoop_api:
              type: object
              properties:
                status:
                  type: string
                  example: healthy
                latency_ms:
                  type: integer
                  example: 120
            claude_api:
              type: object
              properties:
                status:
                  type: string
                  example: healthy
                latency_ms:
                  type: integer
                  example: 200

  responses:
    Unauthorized:
      description: Authentication required or token invalid/expired
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            error:
              code: 1001
              message: Access token has expired.
              detail: The JWT access token provided in the Authorization header is expired.
            meta:
              request_id: req_abc123def456
              timestamp: "2026-03-24T10:30:00Z"

    NotFound:
      description: Resource not found
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ValidationError:
      description: Validation failed
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            error:
              code: 2001
              message: Validation failed.
              detail: One or more fields failed validation.
              fields:
                username: Must be 3-30 characters, alphanumeric and underscores only.
            meta:
              request_id: req_abc123def456
              timestamp: "2026-03-24T10:30:00Z"

    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
            example: 30
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          schema:
            type: integer
            example: 0
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            error:
              code: 5001
              message: Rate limit exceeded.
              detail: You have exceeded the rate limit for this endpoint.
              retry_after_seconds: 30
            meta:
              request_id: req_abc123def456
              timestamp: "2026-03-24T10:30:00Z"

    ServerError:
      description: Internal server error
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            error:
              code: 5000
              message: Internal server error
            meta:
              request_id: req_abc123def456
              timestamp: "2026-03-24T10:30:00Z"

# ════════════════════════════════════════════════════════════════
# PATHS
# ════════════════════════════════════════════════════════════════
paths:
  # ──────────────── Auth ────────────────
  /v1/auth/apple:
    post:
      operationId: authApple
      summary: Sign in with Apple
      description: Authenticate via Sign in with Apple. Handles both registration and returning login.
      tags: [Auth]
      security: []
      parameters:
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/XDeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleAuthRequest'
      responses:
        "200":
          description: Successfully authenticated
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                type: object
                required: [ok, data, meta]
                properties:
                  ok:
                    type: boolean
                    const: true
                  data:
                    allOf:
                      - $ref: '#/components/schemas/AuthTokens'
                      - type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/Meta'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "409":
          description: Account in recovery window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "429":
          $ref: '#/components/responses/RateLimited'
        "500":
          $ref: '#/components/responses/ServerError'

  /v1/auth/refresh:
    post:
      operationId: authRefresh
      summary: Refresh access token
      description: Exchange a valid refresh token for a new access + refresh token pair (rotation).
      tags: [Auth]
      security: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        "200":
          description: New token pair issued
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/AuthTokens'
                  meta:
                    $ref: '#/components/schemas/Meta'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/RateLimited'

  /v1/auth/logout:
    post:
      operationId: authLogout
      summary: Logout and revoke tokens
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        "200":
          description: Tokens revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      revoked_count:
                        type: integer
                        example: 1
                  meta:
                    $ref: '#/components/schemas/Meta'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/RateLimited'

  /v1/auth/rotate:
    post:
      operationId: authRotate
      summary: Force-rotate all tokens
      description: Revoke all sessions when compromise is suspected. Returns new token pair.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateRequest'
      responses:
        "200":
          description: All sessions invalidated, new tokens issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  data:
                    allOf:
                      - $ref: '#/components/schemas/AuthTokens'
                      - type: object
                        properties:
                          sessions_revoked:
                            type: integer
                            example: 3
                          message:
                            type: string
                            example: All previous sessions invalidated.
                  meta:
                    $ref: '#/components/schemas/Meta'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/RateLimited'

  /v1/auth/recover:
    post:
      operationId: authRecover
      summary: Recover deleted account
      description: Re-login within 30 days of deletion with same Apple ID restores account.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoverRequest'
      responses:
        "200":
          description: Account recovered
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  data:
                    allOf:
                      - $ref: '#/components/schemas/AuthTokens'
                      - type: object
                        properties:
                          user:
                            type: object
                            properties:
                              id:
                                type: string
                                example: usr_abc123def456
                              username:
                                type: string
                                example: nicola_d
                              display_name:
                                type: string
                                example: Nicola Debbia
                              recovered_at:
                                type: string
                                format: date-time
                                example: "2026-03-25T08:00:00Z"
                  meta:
                    $ref: '#/components/schemas/Meta'
        "404":
          description: No deleted account for this Apple ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "410":
          description: Recovery window expired (>30 days)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "429":
          $ref: '#/components/responses/RateLimited'

  /v1/.well-known/jwks.json:
    get:
      operationId: getJWKS
      summary: JWKS public keys
      description: JSON Web Key Set for JWT signature verification.
      tags: [Auth]
      security: []
      responses:
        "200":
          description: Public key set
          headers:
            Cache-Control:
              schema:
                type: string
                example: "public, max-age=86400"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKSResponse'

  # ──────────────── Users ────────────────
  /v1/users/me:
    get:
      operationId: getCurrentUser
      summary: Get current user profile
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        "200":
          description: User profile
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/Meta'
        "304":
          description: Not Modified (ETag match)
        "401":
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateCurrentUser
      summary: Update current user profile
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  pattern: '^[a-zA-Z0-9_]{3,30}$'
                  example: nicola
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 50
                  example: Nicola D.
                bio:
                  type: string
                  maxLength: 160
                  example: Builder.
                timezone:
                  type: string
                  example: Europe/Rome
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/Meta'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "409":
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteCurrentUser
      summary: Delete account
      description: GDPR-compliant soft-delete. Data permanently removed after 30 days.
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  const: DELETE
                  example: DELETE
      responses:
        "200":
          description: Account scheduled for deletion
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Account scheduled for deletion. Data permanently removed after 30 days.
                      recovery_deadline:
                        type: string
                        format: date-time
                        example: "2026-04-23T10:40:00Z"
                  meta:
                    $ref: '#/components/schemas/Meta'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/RateLimited'

  /v1/users/me/avatar/presign:
