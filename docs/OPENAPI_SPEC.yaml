    delete:
      operationId: nutritrackDisconnect
      summary: Disconnect NutriTrack
      tags: [NutriTrack]
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      disconnected:
                        type: boolean
                        example: true
                  meta:
                    $ref: '#/components/schemas/Meta'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /v1/integrations/nutritrack/credentials:
    patch:
      operationId: nutritrackUpdateCredentials
      summary: Update NutriTrack credentials
      description: Update NutriTrack connection credentials (base URL and/or PIN) without disconnecting. Server re-tests connectivity after update.
      tags: [NutriTrack]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                base_url:
                  type: string
                  format: uri
                  description: NutriTrack server URL. Private IPs blocked.
                  example: https://nutritrack.nicoladebbia.com
                pin:
                  type: string
                  description: 4-8 digit access PIN
                  example: "654321"
      responses:
        "200":
          description: Credentials updated and connectivity verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      connected:
                        type: boolean
                        example: true
                      tested_at:
                        type: string
                        format: date-time
                        example: "2026-03-24T12:00:00Z"
                      base_url:
                        type: string
                        example: https://nutritrack.nicoladebbia.com
                  meta:
                    $ref: '#/components/schemas/Meta'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: NutriTrack not connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "502":
          description: NutriTrack unreachable
          content:
            application/json:
              schema:
