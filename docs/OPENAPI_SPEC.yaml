            type: string
            enum: [upcoming, active, completed]
            example: active
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Challenge'
                  meta:
                    $ref: '#/components/schemas/Meta'
        "401":
          $ref: '#/components/responses/Unauthorized'

  # ──────────────── Admin ────────────────
  /v1/admin/users:
    get:
      operationId: adminListUsers
      summary: List all users (admin)
      tags: [Admin]
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, last_active_at, xp_total, username]
            default: created_at
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUser'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  meta:
                    $ref: '#/components/schemas/Meta'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: Admin scope required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/admin/stats:
    get:
      operationId: adminGetStats
      summary: Get system stats (admin)
      tags: [Admin]
      responses:
        "200":
          description: System statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/SystemStats'
                  meta:
                    $ref: '#/components/schemas/Meta'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: Admin scope required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/admin/users/{id}/suspend:
    post:
      operationId: adminSuspendUser
      summary: Suspend user (admin)
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: Violated terms of service
                duration_days:
                  type: integer
                  nullable: true
                  example: 7
      responses:
        "200":
          description: User suspended
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      suspended:
                        type: boolean
                        example: true
                      suspended_until:
                        type: string
                        format: date-time
                        nullable: true
                        example: "2026-03-31T10:00:00Z"
                  meta:
                    $ref: '#/components/schemas/Meta'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: Admin scope required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          $ref: '#/components/responses/NotFound'

  /v1/admin/audit-log:
    get:
      operationId: adminGetAuditLog
      summary: Get audit log (admin)
      tags: [Admin]
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: user_id
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/StartDateParam'
        - $ref: '#/components/parameters/EndDateParam'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1234
                        user_id:
                          type: string
                          nullable: true
                          example: usr_abc123def456
                        actor_id:
                          type: string
                          nullable: true
                          example: usr_admin001
                        action:
                          type: string
                          example: user.deleted
                        resource:
                          type: string
                          example: users
                        resource_id:
                          type: string
                          nullable: true
                          example: usr_abc123def456
                        details:
                          type: object
                          nullable: true
                          additionalProperties: true
                        ip_address:
                          type: string
                          nullable: true
                          example: 203.0.113.1
                        created_at:
                          type: string
                          format: date-time
                          example: "2026-03-24T19:00:00Z"
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  meta:
                    $ref: '#/components/schemas/Meta'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: Admin scope required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ──────────────── Config ────────────────
  /v1/config:
    get:
      operationId: getAppConfig
      summary: Get app configuration
      description: Feature flags, minimum version, maintenance mode. Checked on every app launch.
      tags: [Config]
      security: []
      parameters:
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        "200":
          description: App configuration
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              schema:
                type: string
                example: "public, max-age=300"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/AppConfig'
                  meta:
                    $ref: '#/components/schemas/Meta'
        "304":
          description: Not Modified

  # ──────────────── WebSocket ────────────────
  /v1/ws:
    get:
      operationId: websocketConnect
      summary: WebSocket connection
      description: |
        Upgrade to WebSocket for live updates. JWT passed as query parameter.
        Events: leaderboard.update, challenge.score_update, challenge.completed,
        achievement.earned, friend.request, xp.earned.
        Client sends ping every 30s, server responds pong.
      tags: [Realtime]
      parameters:
        - name: token
          in: query
          required: true
          description: JWT access token
          schema:
            type: string
            example: eyJhbGciOiJFUzI1NiIs...
      responses:
        "101":
          description: Switching Protocols (WebSocket upgrade)

  # ──────────────── Health ────────────────
  /v1/health:
    get:
      operationId: healthCheck
      summary: Full health check
      description: Checks all dependencies (database, Redis, Whoop API, Claude API).
      tags: [Health]
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/HealthResponse'
                  meta:
                    $ref: '#/components/schemas/Meta'
        "503":
          description: Unhealthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: false
                  data:
                    $ref: '#/components/schemas/HealthResponse'
                  meta:
                    $ref: '#/components/schemas/Meta'

  /v1/health/ready:
    get:
      operationId: readinessProbe
      summary: Readiness probe
      description: "Lightweight check. 200 = ready, 503 = not ready."
      tags: [Health]
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
        "503":
          description: Not ready

  /v1/health/live:
    get:
      operationId: livenessProbe
      summary: Liveness probe
      description: "200 = process running. No dependency checks."
      tags: [Health]
      security: []
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: alive
