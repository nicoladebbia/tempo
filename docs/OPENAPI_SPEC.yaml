          schema:
            type: string
            default: tempo
            example: tempo
      responses:
        "200":
          description: Authorization URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      authorization_url:
                        type: string
                        format: uri
                        example: https://api.prod.whoop.com/oauth/oauth2/auth?client_id=tempo_app&...
                      state:
                        type: string
                        example: a1b2c3d4e5f6
                  meta:
                    $ref: '#/components/schemas/Meta'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "409":
