      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [week_start]
              properties:
                week_start:
                  type: string
                  format: date
                  example: "2026-03-18"
                force_regenerate:
                  type: boolean
                  default: false
                  example: false
      responses:
        "200":
          description: Weekly insight
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/WeeklyInsight'
                  meta:
                    $ref: '#/components/schemas/Meta'
