          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      connected:
                        type: boolean
                        example: true
                      base_url:
                        type: string
                        example: https://nutritrack.nicoladebbia.com
                      last_success_at:
                        type: string
                        format: date-time
                        nullable: true
                        example: "2026-03-24T12:00:00Z"
                      failure_count:
                        type: integer
                        example: 0
                      degraded:
                        type: boolean
                        example: false
                  meta:
                    $ref: '#/components/schemas/Meta'
        "401":
          $ref: '#/components/responses/Unauthorized'

