name: iOS Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta*'

concurrency:
  group: ios-release
  cancel-in-progress: false

env:
  XCODE_VERSION: "16.2"
  SCHEME: "Tempo"
  PROJECT: "Tempo.xcodeproj"

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ios.yml
    secrets: inherit

  release:
    name: Build & Upload to TestFlight
    runs-on: macos-14
    timeout-minutes: 45
    needs: test
    environment: production
    defaults:
      run:
        working-directory: Tempo
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          MARKETING_VERSION="${TAG%%-*}"
          echo "marketing_version=$MARKETING_VERSION" >> $GITHUB_OUTPUT
          BUILD_NUMBER=$(date +%Y%m%d%H%M)
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          if [[ "$TAG" == *"-beta"* ]]; then
            echo "is_beta=true" >> $GITHUB_OUTPUT
          else
            echo "is_beta=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Fastlane
        run: |
          gem install bundler
          bundle install --jobs 4 --retry 3

      - name: Setup code signing
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_TOKEN_BASE64 }}
        run: bundle exec fastlane match appstore --readonly

      - name: Generate project
        run: |
          if command -v xcodegen &> /dev/null; then
            xcodegen generate
          fi

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          bundle exec fastlane beta \
            version:"${{ steps.version.outputs.marketing_version }}" \
            build_number:"${{ steps.version.outputs.build_number }}"

      - name: Upload dSYMs to Crashlytics
        run: |
          if [ -d "build/Tempo.xcarchive/dSYMs" ]; then
            find build/Tempo.xcarchive/dSYMs -name "*.dSYM" | while read dsym; do
              ./Pods/FirebaseCrashlytics/upload-symbols \
                -gsp Tempo/GoogleService-Info.plist \
                -p ios "$dsym" || true
            done
          fi

      - name: Create GitHub Release
        if: steps.version.outputs.is_beta == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.tag }}
          name: Tempo ${{ steps.version.outputs.marketing_version }}
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Create GitHub Pre-Release
        if: steps.version.outputs.is_beta == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.tag }}
          name: Tempo ${{ steps.version.outputs.tag }} (Beta)
          generate_release_notes: true
          draft: false
          prerelease: true

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "iOS Release ${{ steps.version.outputs.tag }}: ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Tempo iOS ${{ steps.version.outputs.tag }}*\nStatus: ${{ job.status }}\nBuild: ${{ steps.version.outputs.build_number }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
